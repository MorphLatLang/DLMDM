  .SUFFIX    { background: #fffaf5; }
  .ENDING    { background: #f9fff8; }

.pos-marker {

    border: 1px solid #dcdcdc;
    padding: 2px 4px;
    border-radius: 2px;
    font-size: 0.85em;
    font-weight: normal;
    font-family: inherit;
    display: inline-block;
    margin-bottom: 2px;
}

/* FORM micro-highlight (root-register pastel style) */
.form-highlight {
    padding: 2px 4px;
    border-radius: 2px;
    font-size: 0.85em;
    font-family: inherit;
    border: 1px solid rgba(0,0,0,0.08);
}

/* Category-specific pastel colors */
.PREFIX .form-highlight {
    background: #e8f3ff;
}

.SUFFIX .form-highlight {
    background: #ffe8f0;
}

.ENDING .form-highlight {
    background: #fff8d9;
}

.LINKVOWEL .form-highlight {
    background: #e8ffe8;
}

  .show-more {
      color: #0066cc;
      cursor: pointer;
      font-size: 0.9em;
      margin-left: 4px;
  }

const lvColl = new Intl.Collator("lv", { usage: "sort", sensitivity: "base" });
const typeOrder = { PREFIX: 1, SUFFIX: 2, ENDING: 3, LINKVOWEL: 4 };

function collapseList(text) {
    const items = text.split(", ").map(s => s.trim());
    if (items.length <= 60) return text;   // threshold = 60

    const visible = items.slice(0, 60).join(", ");
    const hidden = items.slice(60).join(", ");

    const id = "lm" + Math.random().toString(36).slice(2);

    return `
        <span>${visible}</span>
        <span id="${id}" style="display:none;">, ${hidden}</span>
        <span class="show-more" onclick="
            const el = document.getElementById('${id}');
            if (el.style.display === 'none') {
                el.style.display = 'inline';
                this.textContent = 'show less';
            } else {
                el.style.display = 'none';
                this.textContent = 'show more';
            }
        ">show more</span>
    `;
}

function formatAffixLemmaRes(raw) {
    if (!raw) return "";
    const segments = raw.split(";");

    return segments.map(seg => {
        const parts = seg.split(":");

        if (parts.length === 3) {
            const [posn, pos, lemmas] = parts;
            const clean = lemmas.replace(/,/g, ", ");
            return `
                <div style="margin-bottom:6px;">
                    <span class="pos-marker">${posn}</span><br>
                    <b>${pos}</b><br>
                    ${collapseList(clean)}
                </div>
            `;
        }

        if (parts.length === 2) {
            const [pos, lemmas] = parts;
            const clean = lemmas.replace(/,/g, ", ");
            return `
                <div style="margin-bottom:6px;">
                    <b>${pos}</b><br>
                    ${collapseList(clean)}
                </div>
            `;
        }

        return `<div>${seg.replace(/,/g, ", ")}</div>`;
    }).join("");
}

function buildTable(rows) {
    const groups = {};

    for (const row of rows) {
        const mid = row[0];
        if (!groups[mid]) groups[mid] = [];
        groups[mid].push(row);
    }

    const blocks = Object.entries(groups).map(([mid, rows]) => ({
        morphid: mid,
        rows,
        sortKey: rows[0][3] || "",
        type: rows[0][1]
    }));

    blocks.sort((a, b) => {
        const t = typeOrder[a.type] - typeOrder[b.type];
        if (t !== 0) return t;
        return lvColl.compare(a.sortKey, b.sortKey);
    });

    let html = `
      <table>
        <thead>
          <tr>
            <th>MORPHID</th>
            <th>MORPHTYPE</th>
            <th>FORM</th>
            <th>AFFIXLEMMARES</th>
          </tr>
        </thead>
        <tbody>
    `;

    for (const block of blocks) {
        const { morphid, rows } = block;
        const rowspan = rows.length;
        let first = true;

        for (const row of rows) {
            html += `<tr class="${row[1]}">`;

            if (first) {
                html += `<td rowspan="${rowspan}">${morphid}</td>`;
                first = false;
            }

            html += `<td>${row[1]}</td>`;
            html += `<td><span class="form-highlight">${row[3]}</span></td>`;
            html += `<td>${formatAffixLemmaRes(row[6])}</td>`;

            html += `</tr>`;
        }
    }

    html += `</tbody></table>`;
    return html;
}

function renderStatic() {
    const rows = TSV_DATA.trim().split(/\r?\n/).map(line => line.split("\t"));
    const data = rows.slice(1);

    const prefix    = data.filter(r => r[1] === "PREFIX");
    const suffix    = data.filter(r => r[1] === "SUFFIX");
    const ending    = data.filter(r => r[1] === "ENDING");
    const linkvowel = data.filter(r => r[1] === "LINKVOWEL");

    document.getElementById("PREFIX").innerHTML    = buildTable(prefix);
    document.getElementById("SUFFIX").innerHTML    = buildTable(suffix);
    document.getElementById("ENDING").innerHTML    = buildTable(ending);
    document.getElementById("LINKVOWEL").innerHTML = buildTable(linkvowel);
}

renderStatic();

document.querySelectorAll(".tab-button").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(btn.dataset.type).classList.add("active");
    });
});
</script>
